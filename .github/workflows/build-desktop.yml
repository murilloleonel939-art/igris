name: Construir Igris para Windows

on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop/**'
      - '.github/workflows/build-desktop.yml'

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Python y dependencias de voz
        run: |
          py -3 -m pip install --upgrade pip
          py -3 -m pip install -r requirements.txt pyinstaller

      - name: Empaquetar motor Whisper
        run: py -3 -m PyInstaller --onefile --name voice_worker voice_worker.py

      - name: Copiar motor de voz al escritorio Electron
        run: Copy-Item dist/voice_worker.exe voice_worker.exe

      - name: Construir ejecutable portable
        run: npm run dist

      - name: Publicar ejecutable descargable
        uses: actions/upload-artifact@v4
        with:
          name: Igris-Windows
          path: desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 30
