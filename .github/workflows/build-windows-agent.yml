name: Build Windows agent installer

on:
  workflow_dispatch:
  push:
    tags: ['agent-v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build executable
        shell: pwsh
        run: .\windows_agent\build-exe.ps1
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: '& "C:\\Program Files (x86)\\Inno Setup 6\\ISCC.exe" windows_agent\\igris-agent.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: IgrisAgentSetup-v7
          path: windows_agent/output/IgrisAgentSetup-v7.exe
      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: windows_agent/output/IgrisAgentSetup-v7.exe
