name: Build Windows agent installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'windows_agent/**'
      - 'requirements.txt'
      - '.github/workflows/build-windows-agent.yml'
    tags: ['agent-v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build executable
        shell: pwsh
        run: .\windows_agent\build-exe.ps1
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: '& "C:\\Program Files (x86)\\Inno Setup 6\\ISCC.exe" windows_agent\\igris-agent.iss'
      - name: Validate installer naming
        shell: pwsh
        run: .\windows_agent\validate-workflow.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: IgrisAgentSetup-v10
          path: windows_agent/output/IgrisAgentSetup-v10.exe
      - name: Copy installer into frontend
        shell: pwsh
        run: Copy-Item windows_agent/output/IgrisAgentSetup-v10.exe web/public/downloads/IgrisAgentSetup-v10.exe -Force
      - name: Publish installer in repository
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/downloads/IgrisAgentSetup-v10.exe
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "build: publicar instalador IgrisAgent v10"
            if ($LASTEXITCODE -ne 0) { throw "No se pudo crear el commit del instalador" }
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { throw "No se pudo publicar el instalador en main" }
          }
      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: windows_agent/output/IgrisAgentSetup-v10.exe
