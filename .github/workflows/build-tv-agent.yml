name: Build Android TV agent

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android_tv_agent/**'
      - '.github/workflows/build-tv-agent.yml'
  tags: ['tv-agent-v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable APK
        working-directory: android_tv_agent
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify APK
        run: test -s android_tv_agent/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: IgrisTvAgent
          path: android_tv_agent/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK for user download
        if: github.ref == 'refs/heads/main'
        run: |
          cp android_tv_agent/app/build/outputs/apk/debug/app-debug.apk web/public/downloads/IgrisTvAgent.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public/downloads/IgrisTvAgent.apk
          git diff --cached --quiet || git commit -m "build: publicar Igris TV Agent APK"
          git push origin HEAD:main
      - name: Publish release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android_tv_agent/app/build/outputs/apk/debug/app-debug.apk
